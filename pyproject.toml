[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stargrave"
version = "0.1.0"
description = "Star 仓库清理建议器（StarGrave）CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyGithub>=2.9", "rich>=15.0"]

[project.scripts]
stargrave = "main:main"

[tool.setuptools]
py-modules = ["actions", "analyze", "gh_data", "main", "store"]
include-package-data = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]