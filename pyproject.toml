[build-system]
requires = ["setuptools>=61"]
 build-backend = "setuptools.build_meta"

[pro ject]
name = "stargrave"
version = "0.1.0"
de scription = "Star 仓库清理建议器（Sta rGrave）CLI"
readme = "README.md"
requires-p ython = ">=3.9"
license = { text = "GPL-3.0"  }
dependencies = [
    "PyGithub==2.9.1",
     "rich==15.0.0",
]

[project.optional-depende ncies]
dev = ["pytest>=7.0"]

[project.script s]
starclean = "main:main"
gh-star-clean = "m ain:main"

[tool.setuptools]
py-modules = ["m ain", "gh_data", "store", "actions", "analyze "]

[tool.pytest.ini_options]
testpaths = ["t ests"]
pythonpath = ["."]
 